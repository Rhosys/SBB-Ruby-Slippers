[versions]
agp                 = "8.5.0"
kotlin              = "2.0.0"
ksp                 = "2.0.0-1.0.21"
compose-bom         = "2024.06.00"
hilt                = "2.51.1"
hilt-ext            = "1.2.0"
lifecycle           = "2.8.2"
navigation          = "2.7.7"
coroutines          = "1.8.1"
datastore           = "1.1.1"
room                = "2.6.1"
work                = "2.9.0"
location            = "21.3.0"
glance              = "1.1.0"
posthog             = "3.9.1"
retrofit            = "2.11.0"
okhttp              = "4.12.0"
serialization       = "1.6.3"
junit               = "4.13.2"
coroutines-test     = "1.8.1"
coil                = "2.7.0"
commons-compress    = "1.26.2"
xz                  = "1.9"
wear-compose        = "1.4.1"
wearable            = "18.2.0"

[libraries]
androidx-core-ktx           = { module = "androidx.core:core-ktx",                          version = "1.13.1" }
androidx-lifecycle-runtime  = { module = "androidx.lifecycle:lifecycle-runtime-ktx",         version.ref = "lifecycle" }
androidx-activity-compose   = { module = "androidx.activity:activity-compose",               version = "1.9.0" }

compose-bom                 = { module = "androidx.compose:compose-bom",                     version.ref = "compose-bom" }
compose-ui                  = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview  = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling          = { module = "androidx.compose.ui:ui-tooling" }
compose-material3           = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

navigation-compose          = { module = "androidx.navigation:navigation-compose",           version.ref = "navigation" }

hilt-android                = { module = "com.google.dagger:hilt-android",                   version.ref = "hilt" }
hilt-compiler               = { module = "com.google.dagger:hilt-android-compiler",          version.ref = "hilt" }
hilt-navigation-compose     = { module = "androidx.hilt:hilt-navigation-compose",            version.ref = "hilt-ext" }
hilt-work                   = { module = "androidx.hilt:hilt-work",                          version.ref = "hilt-ext" }
hilt-ext-compiler           = { module = "androidx.hilt:hilt-compiler",                      version.ref = "hilt-ext" }

lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose",   version.ref = "lifecycle" }
lifecycle-runtime-compose   = { module = "androidx.lifecycle:lifecycle-runtime-compose",     version.ref = "lifecycle" }

kotlinx-coroutines-android       = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android",      version.ref = "coroutines" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }

datastore-preferences       = { module = "androidx.datastore:datastore-preferences",         version.ref = "datastore" }

room-runtime                = { module = "androidx.room:room-runtime",                       version.ref = "room" }
room-ktx                    = { module = "androidx.room:room-ktx",                           version.ref = "room" }
room-compiler               = { module = "androidx.room:room-compiler",                      version.ref = "room" }

work-runtime-ktx            = { module = "androidx.work:work-runtime-ktx",                  version.ref = "work" }

play-services-location      = { module = "com.google.android.gms:play-services-location",   version.ref = "location" }

glance-appwidget            = { module = "androidx.glance:glance-appwidget",                 version.ref = "glance" }
glance-material3            = { module = "androidx.glance:glance-material3",                 version.ref = "glance" }

posthog-android             = { module = "com.posthog:posthog-android",                       version.ref = "posthog" }

# Networking — direct calls to the public Swiss transport API (transport.opendata.ch)
retrofit                    = { module = "com.squareup.retrofit2:retrofit",                  version.ref = "retrofit" }
retrofit-serialization      = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp-logging              = { module = "com.squareup.okhttp3:logging-interceptor",         version.ref = "okhttp" }
kotlinx-serialization-json  = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

coil-compose                = { module = "io.coil-kt:coil-compose",                          version.ref = "coil" }

commons-compress            = { module = "org.apache.commons:commons-compress",               version.ref = "commons-compress" }
xz-java                     = { module = "org.tukaani:xz",                                    version.ref = "xz" }

wear-compose-material       = { module = "androidx.wear.compose:compose-material",           version.ref = "wear-compose" }
wear-compose-foundation     = { module = "androidx.wear.compose:compose-foundation",         version.ref = "wear-compose" }
wear-compose-navigation     = { module = "androidx.wear.compose:compose-navigation",         version.ref = "wear-compose" }
play-services-wearable      = { module = "com.google.android.gms:play-services-wearable",   version.ref = "wearable" }

junit                       = { module = "junit:junit",                                      version.ref = "junit" }
kotlinx-coroutines-test     = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",   version.ref = "coroutines-test" }

[plugins]
android-application = { id = "com.android.application",                  version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",              version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt                = { id = "com.google.dagger.hilt.android",            version.ref = "hilt" }
ksp                 = { id = "com.google.devtools.ksp",                   version.ref = "ksp" }
