[versions]
agp                 = "8.5.0"
kotlin              = "2.0.0"
ksp                 = "2.0.0-1.0.21"
compose-bom         = "2024.06.00"
hilt                = "2.51.1"
lifecycle           = "2.8.2"
navigation          = "2.7.7"
coroutines          = "1.8.1"
datastore           = "1.1.1"
posthog             = "3.9.1"
retrofit            = "2.11.0"
okhttp              = "4.12.0"
serialization       = "1.6.3"
junit               = "4.13.2"
coroutines-test     = "1.8.1"

[libraries]
androidx-core-ktx           = { module = "androidx.core:core-ktx",                          version = "1.13.1" }
androidx-lifecycle-runtime  = { module = "androidx.lifecycle:lifecycle-runtime-ktx",         version.ref = "lifecycle" }
androidx-activity-compose   = { module = "androidx.activity:activity-compose",               version = "1.9.0" }

compose-bom                 = { module = "androidx.compose:compose-bom",                     version.ref = "compose-bom" }
compose-ui                  = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview  = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling          = { module = "androidx.compose.ui:ui-tooling" }
compose-material3           = { module = "androidx.compose.material3:material3" }

navigation-compose          = { module = "androidx.navigation:navigation-compose",           version.ref = "navigation" }

hilt-android                = { module = "com.google.dagger:hilt-android",                   version.ref = "hilt" }
hilt-compiler               = { module = "com.google.dagger:hilt-android-compiler",          version.ref = "hilt" }
hilt-navigation-compose     = { module = "androidx.hilt:hilt-navigation-compose",            version = "1.2.0" }

lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose",   version.ref = "lifecycle" }
lifecycle-runtime-compose   = { module = "androidx.lifecycle:lifecycle-runtime-compose",     version.ref = "lifecycle" }

kotlinx-coroutines-android  = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

datastore-preferences       = { module = "androidx.datastore:datastore-preferences",         version.ref = "datastore" }

posthog-android             = { module = "com.posthog:posthog-android",                       version.ref = "posthog" }

# Networking — direct calls to the public Swiss transport API (transport.opendata.ch)
retrofit                    = { module = "com.squareup.retrofit2:retrofit",                  version.ref = "retrofit" }
retrofit-serialization      = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp-logging              = { module = "com.squareup.okhttp3:logging-interceptor",         version.ref = "okhttp" }
kotlinx-serialization-json  = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

junit                       = { module = "junit:junit",                                      version.ref = "junit" }
kotlinx-coroutines-test     = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",   version.ref = "coroutines-test" }

[plugins]
android-application = { id = "com.android.application",                  version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",              version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt                = { id = "com.google.dagger.hilt.android",            version.ref = "hilt" }
ksp                 = { id = "com.google.devtools.ksp",                   version.ref = "ksp" }
