# Mirrors the validate/test stages of .gitlab-ci.yml for GitHub Actions.
# Build-release and deploy live exclusively in GitLab CI (signing + Play Store).

name: Android CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths-ignore:
      - "firmware/**"
      - ".github/workflows/firmware.yml"

jobs:
  # ── Validate ────────────────────────────────────────────────────────────────

  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile debug Kotlin
        run: ./gradlew compileDebugKotlin

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Lint debug
        run: ./gradlew lintDebug

  # ── Test ────────────────────────────────────────────────────────────────────

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [compile]
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

  # ── Build ────────────────────────────────────────────────────────────────────

  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: [compile, test]
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: |
          BRANCH="${GITHUB_REF_NAME:-main}"
          BUILD_NUMBER="${{ github.run_number }}"
          if [[ "$BRANCH" =~ ^release/([0-9]+\.[0-9]+)$ ]]; then
            VERSION_NAME="${BASH_REMATCH[1]}.${BUILD_NUMBER}"
          else
            VERSION_NAME="1.0.${BUILD_NUMBER}"
          fi
          ./gradlew assembleDebug \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$BUILD_NUMBER"

      - name: Set timestamp
        id: ts
        run: echo "iso=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-${{ steps.ts.outputs.iso }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
